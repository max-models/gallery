# Read by gallery-tools without running the script (see the Adding a study guide).
category: Neutral-beam injection
kind: example
public: true
codes:
- beamtracer
- wellbalanced
- opencr
- plasmacoll
- plasma-plots
level: advanced
summary: >-
  A 1 MeV negative-ion beam traced through one channel of a plasma neutralizer, iterated with a
  global model of the plasma it makes, against the beam's divergence.
docs_preset: full
runtime: about 4.5 minutes measured on a loaded 4-core machine; the smoke preset under a minute
status: >-
  An example of the coupling, not a neutralizer design: the beam's cross sections are illustrative
  placeholders, the channel is planar (2D) with uniform gas and plasma, and the plasma is a global
  model. It checks that the traced channel reproduces the axis model for a parallel beam, and that
  for a diverging beam the neutral share of the transmitted beam does not change, so the loss is
  geometric. The full preset takes a time step of a whole cell and a fixed-point tolerance of 1e-3,
  which change the result at 10 mrad by less than 1e-6.
