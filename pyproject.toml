# Generated by `gallery export` from the private gallery: do not edit by hand.
[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools" ]

[project]
name = "gallery"
version = "0.1.0"
description = "Computational studies with the max-models codes: verification, method demonstrations and examples."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gallery-tools @ git+https://github.com/spokes3d/gallery-template@devel",
  "beamtracer",
  "freeofcharge",
  "gvec",
  "huggingface-hub",
  "jax",
  "matplotlib",
  "numpy",
  "opencr",
  "pandas",
  "plasma-plots",
  "plasmacoll",
  "pyarrow",
  "scipy",
  "simgeometry",
  "slowcooker; python_version>='3.12'",
  "tree-d-3d",
  "wellbalanced",
  "xarray",
]
optional-dependencies.docs = [
  "ipykernel",
  "kaleido",
  "plasma-plots[web]",
]
optional-dependencies.test = [ "pytest" ]

[tool.setuptools]
py-modules = [  ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-ra"

[tool.uv.sources]
beamtracer = { git = "https://github.com/max-models/beamtracer", branch = "devel" }
freeofcharge = { git = "https://github.com/max-models/freeofcharge", branch = "devel" }
opencr = { git = "https://github.com/max-models/opencr", branch = "devel" }
plasma-plots = { git = "https://github.com/max-models/plasma-plots", branch = "devel" }
slowcooker = { git = "https://github.com/max-models/slowcooker", branch = "devel" }
tree-d-3d = { git = "https://github.com/max-models/tree-d-3d", branch = "devel" }
wellbalanced = { git = "https://github.com/max-models/wellbalanced", branch = "devel" }
